name: Build multi-arch image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/reproduciblebioinformatics/informatica_2026_2027

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: |
          docker run -d --name smoke -p 8888:8888 "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 30); do curl -fs http://localhost:8888/api/status && break; sleep 2; done
          docker logs smoke
          # no password/token: API reachable without auth
          curl -fs http://localhost:8888/api/contents/sharedFolder > /dev/null
          # root is the real /, start folder is /sharedFolder
          curl -fs http://localhost:8888/api/contents/ | grep -q '"sharedFolder"'
          curl -fs http://localhost:8888/lab | grep -o '"preferredPath": *"[^"]*"' | tee /dev/stderr | grep -q sharedFolder
          docker exec smoke jupyter kernelspec list | grep -q ' ir '
          # student can pip install, install R packages and use sudo
          docker exec -u student smoke pip3 install --no-cache-dir numpy
          docker exec -u student smoke Rscript -e 'stopifnot(file.access(.libPaths()[1], 2) == 0)'
          docker exec -u student smoke sudo -n true
          # JupyterLab runs as student (the server writes its cookie secret at startup)
          test "$(docker exec smoke stat -c %U /home/student/.local/share/jupyter/runtime/jupyter_cookie_secret)" = student
          # Linux host UID mapping (what run.sh does on Linux)
          docker rm -f smoke
          docker run -d --name smoke -e HOST_UID=4321 -e HOST_GID=4321 -p 8888:8888 "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 30); do curl -fs http://localhost:8888/api/status && break; sleep 2; done
          test "$(docker exec smoke stat -c %u /home/student/.local/share/jupyter/runtime/jupyter_cookie_secret)" = 4321
          docker exec -u student smoke touch /sharedFolder/probe.txt
          docker exec -u student smoke pip3 install --no-cache-dir tabulate
